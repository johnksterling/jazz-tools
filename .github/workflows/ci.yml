name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.21.x', '1.22.x', '1.23.x']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Install LilyPond
        run: |
          sudo apt-get update
          sudo apt-get install -y lilypond

      - name: Verify Code Formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not properly formatted with gofmt:"
            gofmt -l .
            exit 1
          fi

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Tests
        run: go test -v -race ./...

      - name: Build Binary
        run: go build -v -o jazz-tools ./cmd/jazz-tools

      - name: CLI Smoke Tests
        run: |
          ./jazz-tools --help
          ./jazz-tools analyze testdata/Jordu.musicxml
          ./jazz-tools companion testdata/Jordu.musicxml --pdf -o /tmp/smoke_companion.musicxml
