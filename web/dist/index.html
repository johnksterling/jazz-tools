<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>jazz-tools</title>
</head>
<body>
  <div style="font-family: system-ui, sans-serif; padding: 3rem; text-align: center; max-width: 600px; margin: 0 auto; line-height: 1.6;">
    <h2>jazz-tools Web Interface</h2>
    <p>The interactive frontend bundle is not yet built. In the <code>web/</code> directory, run:</p>
    <div style="background: #f1f5f9; padding: 1rem; border-radius: 6px; text-align: left; font-family: monospace;">
      cd web<br />
      npm install<br />
      npm run build
    </div>
    <p style="margin-top: 1.5rem; color: #64748b; font-size: 0.9rem;">Or run <code>npm run dev</code> in <code>web/</code> for local hot-reloading development.</p>
  </div>
</body>
